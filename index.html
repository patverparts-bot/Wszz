<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Оптовый прайс-лист и каталог</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- SheetJS (XLSX reader/writer) -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
body { font-family: 'Inter', sans-serif; }

/* Стиль для увеличения фото при наведении */
.product-img-container {
  position: relative;
  width: 44px;
  height: 44px;
  flex-shrink: 0;
}

.product-img {
  width: 44px;
  height: 44px;
  object-fit: contain;
  border-radius: 8px;
  border: 1px solid #e5e7eb;
  background-color: #ffffff;
  padding: 2px;
  transition: all 0.25s ease-in-out;
  cursor: pointer;
}

.product-img-container:hover .product-img {
  transform: scale(3.5);
  z-index: 50;
  position: absolute;
  top: -10px;
  left: 0;
  box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.25), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
}

.no-img-badge {
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  width: auto;
  min-width: 90px;
  height: 36px;
  padding: 0 8px;
  background-color: #f3f4f6;
  border: 1px dashed #d1d5db;
  border-radius: 8px;
  color: #4b5563;
  font-size: 10px;
  font-weight: 500;
  line-height: 1.2;
  cursor: pointer;
  transition: all 0.2s ease;
}

.no-img-badge:hover {
  background-color: #e5e7eb;
  color: #1d4ed8;
  border-color: #93c5fd;
}
</style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col pb-24">

<!-- Шапка -->
<header class="bg-white border-b border-gray-200 sticky top-0 z-30 shadow-sm">
<div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row justify-between items-center gap-4">
<div class="flex items-center gap-3">
<div class="bg-blue-600 text-white p-2.5 rounded-xl font-bold text-xl shadow-md">📊</div>
<div>
<h1 class="text-xl font-bold text-gray-900">Оптовый каталог товаров</h1>
<p class="text-xs text-blue-600 font-medium" id="file-status">Загрузка данных из Excel...</p>
</div>
</div>
<!-- Поиск -->
<div class="flex items-center gap-3 w-full sm:w-auto">
<input type="text" id="searchInput" placeholder="Поиск товара или артикула..."
class="w-full sm:w-72 px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
</div>
</div>
</header>

<!-- Основной контент -->
<main class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8 flex-grow w-full">

<!-- Панель фильтров -->
<div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 mb-6 grid grid-cols-1 md:grid-cols-2 gap-4">
<div>
<label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Фильтр по бренду</label>
<select id="brandFilter" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
<option value="">Все бренды</option>
</select>
</div>
<div>
<label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Фильтр по категории</label>
<select id="categoryFilter" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
<option value="">Все категории</option>
</select>
</div>
</div>

<!-- Таблица товаров -->
<div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
<div class="overflow-x-auto">
<table class="w-full text-left border-collapse" id="catalogTable">
<thead>
<tr class="bg-gray-100 text-gray-700 text-xs uppercase tracking-wider border-b border-gray-200">
<th class="py-3 px-4 font-semibold">Артикул</th>
<th class="py-3 px-4 font-semibold">Бренд</th>
<th class="py-3 px-4 font-semibold">Категория</th>
<th class="py-3 px-4 font-semibold">Наименование</th>
<th class="py-3 px-4 font-semibold">Наличие / Склад</th>
<th class="py-3 px-4 font-semibold text-right">Розница (Զեղչված)</th>
<th class="py-3 px-4 font-semibold text-right">Опт (Wholesale)</th>
<th class="py-3 px-4 font-semibold text-center">Действие</th>
</tr>
</thead>
<tbody class="divide-y divide-gray-200 text-sm" id="tableBody">
</tbody>
</table>
</div>
<div id="noResults" class="hidden p-8 text-center text-gray-500">
Товары не найдены по вашему запросу или условиям склада.
</div>
</div>
</main>

<!-- Панель заказа -->
<div id="orderPanel" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-300 shadow-lg p-4 z-40 hidden">
<div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
<div>
<span class="font-bold text-gray-900 text-base">Ваш заказ: </span>
<span id="orderCount" class="text-blue-600 font-semibold">0 товаров</span> |
<span class="font-bold text-gray-900"> Сумма (Опт): </span>
<span id="orderSum" class="text-green-600 font-bold text-lg">0 ֏</span>
</div>
<div class="flex gap-3">
<button onclick="clearOrder()" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-lg text-sm font-medium transition">
Очистить
</button>
<button onclick="openOrderModal()" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-semibold shadow transition">
Оформить заказ
</button>
</div>
</div>
</div>

<!-- Модальное окно заказа -->
<div id="orderModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
<div class="bg-white rounded-2xl max-w-3xl w-full p-6 shadow-2xl max-h-[90vh] flex flex-col">
<div class="flex justify-between items-center mb-4 border-b pb-3">
<h3 class="text-lg font-bold text-gray-900">Содержимое заказа</h3>
<button onclick="closeOrderModal()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
</div>

<div id="modalItemsList" class="overflow-y-auto flex-grow divide-y divide-gray-100 mb-4 max-h-[40vh] text-sm">
</div>

<div class="bg-gray-50 p-3 rounded-xl border border-gray-200 mb-4">
<label class="block text-xs font-bold text-gray-700 uppercase mb-2">Способ оплаты:</label>
<div class="flex flex-col sm:flex-row gap-4">
<label class="flex items-center gap-2 cursor-pointer text-sm font-medium text-gray-800">
<input type="radio" name="paymentMethod" value="Наличными" checked class="w-4 h-4 text-blue-600 focus:ring-blue-500">
<span>💵 Наличными</span>
</label>
<label class="flex items-center gap-2 cursor-pointer text-sm font-medium text-gray-800">
<input type="radio" name="paymentMethod" value="Банковским переводом" class="w-4 h-4 text-blue-600 focus:ring-blue-500">
<span>🏦 Банковским переводом</span>
</label>
</div>
</div>

<div class="border-t pt-4 flex flex-col sm:flex-row justify-between items-center gap-4">
<div>
<span class="text-gray-600 text-sm">Итого сумма: </span>
<span id="modalTotalSum" class="text-xl font-bold text-green-600">0 ֏</span>
</div>
<div class="flex gap-2 flex-wrap justify-end">
<button onclick="closeOrderModal()" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg text-sm">Закрыть</button>
<button onclick="copyOrderText()" class="px-4 py-2 bg-gray-700 hover:bg-gray-800 text-white rounded-lg text-sm font-medium transition">
Скопировать текст
</button>
<button onclick="downloadOrderExcel()" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-lg text-sm shadow transition flex items-center gap-2">
<span>📥</span> Скачать заказ в Excel
</button>
</div>
</div>
</div>
</div>

<!-- Скрипт -->
<script>
let allProducts = [];
let cart = {};

const brandDomains = {
'wanbo': 'wanbo.cn',
'epson': 'epson.com',
'blaupunkt': 'blaupunkt.com',
'apple': 'apple.com',
'samsung': 'samsung.com',
'sony': 'sony.com',
'lg': 'lg.com',
'xiaomi': 'mi.com',
'jbl': 'jbl.com',
'marshall': 'marshallheadphones.com',
'haier': 'haier.com',
'philips': 'philips.com',
'bosch': 'bosch.com',
'dyson': 'dyson.com',
'midea': 'midea.com',
'tefal': 'tefal.com',
'moulinex': 'moulinex.com',
'delonghi': 'delonghi.com',
'braun': 'braun.com',
'canon': 'canon.com',
'nikon': 'nikon.com',
'asus': 'asus.com',
'acer': 'acer.com',
'lenovo': 'lenovo.com',
'hp': 'hp.com',
'dell': 'dell.com',
'huawei': 'huawei.com'
};

function getBrandLogoHtml(brandName) {
if (!brandName || brandName === 'Другие' || brandName === '—') {
return `<span class="px-2 py-1 bg-gray-100 text-gray-700 rounded text-xs font-semibold">${brandName || '—'}</span>`;
}

const cleanBrand = brandName.trim().toLowerCase();
const domain = brandDomains[cleanBrand] || `${cleanBrand.replace(/\s+/g, '')}.com`;
const logoUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;

return `
<div class="flex items-center gap-2">
<img src="${logoUrl}" alt="${brandName}" class="h-5 w-5 object-contain rounded" 
onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';">
<span class="font-semibold text-gray-800 text-xs">${brandName}</span>
</div>
`;
}

function handleImgError(imgElement, searchUrl) {
  const container = imgElement.parentElement;
  if (!imgElement.dataset.triedPub) {
    imgElement.dataset.triedPub = "true";
    imgElement.src = imgElement.dataset.pubUrl;
  } else {
    container.outerHTML = `<a href="${searchUrl}" target="_blank" class="no-img-badge" title="Нажмите, чтобы найти на Zigzag.am">Нажать на артикул товара</a>`;
  }
}

function getProductImageHtml(articul, productName) {
const cleanArt = String(articul).trim();
const a1 = cleanArt.charAt(0) || '0';
const a2 = cleanArt.charAt(1) || '0';

const url1 = `https://www.zigzag.am/media/catalog/product/${a1}/${a2}/${cleanArt}.jpg`;
const url2 = `https://www.zigzag.am/pub/media/catalog/product/${a1}/${a2}/${cleanArt}.jpg`;
const searchUrl = `https://www.zigzag.am/am/catalogsearch/result/?q=${encodeURIComponent(cleanArt)}`;

return `
<div class="product-img-container">
<img src="${url1}" data-pub-url="${url2}" alt="${productName}" class="product-img"
onerror="handleImgError(this, '${searchUrl}')">
</div>
`;
}

async function loadExcelFile() {
try {
document.getElementById('file-status').innerText = 'Загрузка файла PriceList_3.xlsx...';
const response = await fetch('PriceList_3.xlsx');
if (!response.ok) throw new Error('Файл PriceList_3.xlsx не найден на сервере (ошибка 404).');

document.getElementById('file-status').innerText = 'Чтение таблицы...';
const arrayBuffer = await response.arrayBuffer();
const workbook = XLSX.read(arrayBuffer, { type: 'array' });
const sheetName = workbook.SheetNames[0];
const sheet = workbook.Sheets[sheetName];
const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });

if (!rows || !Array.isArray(rows) || rows.length === 0) {
throw new Error('Таблица пуста.');
}

parseExcelRows(rows);
document.getElementById('file-status').innerText = `Успешно загружено товаров: ${allProducts.length}`;
} catch (error) {
console.error(error);
document.getElementById('file-status').innerHTML = `<span class="text-red-600">Ошибка: ${error.message}</span>`;
}
}

function parseExcelRows(rows) {
try {
allProducts = [];

let headerRowIdx = 0;
for (let i = 0; i < Math.min(rows.length, 15); i++) {
const row = rows[i];
if (!row || !Array.isArray(row)) continue;
const rowStr = row.map(c => (c !== null && c !== undefined ? String(c) : '').toLowerCase()).join(' ');
if (rowStr.includes('artikul') || rowStr.includes('brand') || rowStr.includes('wholesale') || rowStr.includes('գին') || rowStr.includes('артикул')) {
headerRowIdx = i;
break;
}
}

const headerRow = (rows[headerRowIdx] && Array.isArray(rows[headerRowIdx])) ? rows[headerRowIdx] : [];
const headers = headerRow.map(c => (c !== null && c !== undefined ? String(c).trim() : ''));

const colMap = {
art: headers.findIndex(h => h && (h.toLowerCase().includes('art') || h.toLowerCase().includes('артикул'))),
brand: headers.findIndex(h => h && (h.toLowerCase().includes('brand') || h.toLowerCase().includes('бренд'))),
category: headers.findIndex(h => h && (h.toLowerCase().includes('group') || h.toLowerCase().includes('kategoriya') || h.toLowerCase().includes('группа') || h.toLowerCase().includes('категория'))),
name: headers.findIndex(h => h && (h.toLowerCase().includes('name') || h.toLowerCase().includes('naimenovanie') || h.toLowerCase().includes('наименование') || h.toLowerCase().includes('товар') || h.toLowerCase().includes('անվանում'))),
retail: headers.findIndex(h => h && (h.includes('Զեղչված') || h.toLowerCase().includes('roznich') || h.toLowerCase().includes('discount'))),
wholesale: headers.findIndex(h => h && (h.includes('Wholesale') || h.toLowerCase().includes('wholesale') || h.toLowerCase().includes('опт'))),
s003: headers.findIndex(h => h === '003'),
s023: headers.findIndex(h => h === '023'),
s026: headers.findIndex(h => h === '026'),
s031: headers.findIndex(h => h === '031')
};

if (colMap.art === -1) colMap.art = 0;
if (colMap.brand === -1) colMap.brand = 1;
if (colMap.category === -1) colMap.category = 2;
if (colMap.name === -1) colMap.name = 4;
if (colMap.retail === -1) colMap.retail = 5;
if (colMap.wholesale === -1) colMap.wholesale = 6;

for (let i = headerRowIdx + 1; i < rows.length; i++) {
const r = rows[i];
if (!r || !Array.isArray(r) || r.length === 0) continue;

const artVal = r[colMap.art];
const art = (artVal !== null && artVal !== undefined) ? String(artVal).trim() : '';
if (!art || art.toLowerCase().includes('artikul') || art.length > 30) continue;

const wholesale = Number(r[colMap.wholesale]) || 0;

if (!wholesale || wholesale <= 0) {
continue;
}

const brandVal = r[colMap.brand];
const brand = (brandVal !== null && brandVal !== undefined) ? String(brandVal).trim() : 'Другие';

const catVal = r[colMap.category];
const category = (catVal !== null && catVal !== undefined) ? String(catVal).trim() : 'Общая';

let name = '';
if (r[colMap.name] !== undefined && r[colMap.name] !== null) {
name = String(r[colMap.name]).trim();
} else {
for (let cell of r) {
if (typeof cell === 'string' && cell.length > 8 && cell !== art && cell !== brand && cell !== category) {
name = cell.trim();
break;
}
}
}

const retail = Number(r[colMap.retail]) || 0;

const q003 = colMap.s003 !== -1 ? (Number(r[colMap.s003]) || 0) : 0;
const q023 = colMap.s023 !== -1 ? (Number(r[colMap.s023]) || 0) : 0;
const q026 = colMap.s026 !== -1 ? (Number(r[colMap.s026]) || 0) : 0;
const q031 = colMap.s031 !== -1 ? (Number(r[colMap.s031]) || 0) : 0;

const targetWarehousesStock = q003 + q023 + q026 + q031;

let otherWarehousesSum = 0;
for (let j = 0; j < r.length; j++) {
if (j === colMap.art || j === colMap.brand || j === colMap.category || j === colMap.name || j === colMap.retail || j === colMap.wholesale || j === colMap.s003 || j === colMap.s023 || j === colMap.s026 || j === colMap.s031) continue;
const val = Number(r[j]);
if (!isNaN(val) && val > 0) {
otherWarehousesSum += val;
}
}

let stockStatus = '';
let isValidStock = false;

if (targetWarehousesStock >= 2) {
isValidStock = true;
let availableIn = [];
if (q003 > 0) availableIn.push('003');
if (q023 > 0) availableIn.push('023');
if (q026 > 0) availableIn.push('026');
if (q031 > 0) availableIn.push('031');
stockStatus = `В наличии (${availableIn.join(', ')})`;
} else if (targetWarehousesStock === 0 && otherWarehousesSum < 5) {
isValidStock = false;
} else if (targetWarehousesStock < 2 && otherWarehousesSum < 5) {
isValidStock = true;
stockStatus = 'Уточнять наличие';
} else if (targetWarehousesStock === 0 && otherWarehousesSum >= 5) {
isValidStock = true;
stockStatus = 'Уточнять наличие';
} else {
isValidStock = true;
stockStatus = 'Уточнять наличие';
}

if (isValidStock) {
allProducts.push({
articul: art,
brand: brand,
category: category,
name: name,
retail: retail,
wholesale: wholesale,
stockStatus: stockStatus
});
}
}

initFilters();
renderTable();
} catch (err) {
console.error(err);
document.getElementById('file-status').innerHTML = `<span class="text-red-600">Ошибка обработки: ${err.message}</span>`;
}
}

function initFilters() {
const brands = [...new Set(allProducts.map(p => p.brand).filter(b => b))].sort();
const brandSelect = document.getElementById('brandFilter');
brandSelect.innerHTML = '<option value="">Все бренды</option>';
brands.forEach(b => {
const opt = document.createElement('option');
opt.value = b;
opt.textContent = b;
brandSelect.appendChild(opt);
});

const categories = [...new Set(allProducts.map(p => p.category).filter(c => c))].sort();
const categorySelect = document.getElementById('categoryFilter');
categorySelect.innerHTML = '<option value="">Все категории</option>';
categories.forEach(c => {
const opt = document.createElement('option');
opt.value = c;
opt.textContent = c;
categorySelect.appendChild(opt);
});

brandSelect.onchange = renderTable;
categorySelect.onchange = renderTable;
}

function renderTable() {
const tbody = document.getElementById('tableBody');
const noResults = document.getElementById('noResults');
tbody.innerHTML = '';

const brandVal = document.getElementById('brandFilter').value;
const categoryVal = document.getElementById('categoryFilter').value;
const searchQuery = (document.getElementById('searchInput').value || '').trim().toLowerCase();

const filtered = allProducts.filter(p => {
const matchBrand = !brandVal || p.brand === brandVal;
const matchCategory = !categoryVal || p.category === categoryVal;
const matchSearch = !searchQuery ||
(p.name || '').toLowerCase().includes(searchQuery) ||
(p.articul || '').toLowerCase().includes(searchQuery);
return matchBrand && matchCategory && matchSearch;
});

if (filtered.length === 0) {
noResults.classList.remove('hidden');
return;
} else {
noResults.classList.add('hidden');
}

filtered.forEach(p => {
const tr = document.createElement('tr');
tr.className = 'hover:bg-blue-50/40 transition-colors border-b border-gray-100';

const isUtochnit = p.stockStatus.includes('Уточнять');
const stockBadgeClass = isUtochnit
? 'bg-amber-100 text-amber-800 border border-amber-300'
: 'bg-emerald-100 text-emerald-800 border border-emerald-300';

const searchUrl = `https://www.zigzag.am/am/catalogsearch/result/?q=${encodeURIComponent(p.articul)}`;
const cartItem = cart[p.articul];

let actionCellHtml = '';
if (!cartItem) {
actionCellHtml = `
<button onclick="addToCart('${p.articul}')" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-semibold shadow transition">
В заказ
</button>
`;
} else {
actionCellHtml = `
<div class="inline-flex items-center border border-blue-500 rounded-lg overflow-hidden bg-blue-50">
<button onclick="changeQty('${p.articul}', -1)" class="px-2.5 py-1 bg-blue-100 hover:bg-blue-200 text-blue-800 font-bold text-xs">-</button>
<span class="px-3 py-1 text-xs font-bold text-blue-900">${cartItem.qty}</span>
<button onclick="changeQty('${p.articul}', 1)" class="px-2.5 py-1 bg-blue-100 hover:bg-blue-200 text-blue-800 font-bold text-xs">+</button>
</div>
`;
}

tr.innerHTML = `
<td class="py-3 px-4 font-mono font-medium text-blue-600">
<a href="${searchUrl}" target="_blank" class="hover:underline flex items-center gap-1" title="Найти на сайте Zigzag.am">
${p.articul} 🔗
</a>
</td>
<td class="py-3 px-4">${getBrandLogoHtml(p.brand)}</td>
<td class="py-3 px-4 text-gray-600">${p.category}</td>
<td class="py-3 px-4">
<div class="flex items-center gap-3">
${getProductImageHtml(p.articul, p.name)}
<span class="text-gray-900 font-medium">${p.name || '—'}</span>
</div>
</td>
<td class="py-3 px-4"><span class="px-2.5 py-1 rounded-full text-xs font-semibold ${stockBadgeClass}">${p.stockStatus}</span></td>
<td class="py-3 px-4 text-right text-gray-600">${p.retail ? p.retail.toLocaleString('ru-RU') + ' ֏' : '—'}</td>
<td class="py-3 px-4 text-right font-semibold text-gray-900">${p.wholesale ? p.wholesale.toLocaleString('ru-RU') + ' ֏' : '—'}</td>
<td class="py-3 px-4 text-center">${actionCellHtml}</td>
`;
tbody.appendChild(tr);
});
}

function addToCart(articul) {
const product = allProducts.find(p => p.articul === articul);
if (!product) return;

if (!cart[articul]) {
cart[articul] = { product: product, qty: 1 };
} else {
cart[articul].qty += 1;
}
updateOrderPanel();
renderTable();
}

function updateOrderPanel() {
const orderPanel = document.getElementById('orderPanel');
let totalCount = 0;
let totalSum = 0;

Object.values(cart).forEach(item => {
totalCount += item.qty;
totalSum += (item.product.wholesale * item.qty);
});

if (totalCount > 0) {
orderPanel.classList.remove('hidden');
document.getElementById('orderCount').innerText = `${totalCount} товаров`;
document.getElementById('orderSum').innerText = totalSum.toLocaleString('ru-RU') + ' ֏';
} else {
orderPanel.classList.add('hidden');
}
}

function clearOrder() {
cart = {};
updateOrderPanel();
renderTable();
}

function openOrderModal() {
const listContainer = document.getElementById('modalItemsList');
listContainer.innerHTML = '';
let totalSum = 0;

Object.values(cart).forEach(item => {
const sum = item.product.wholesale * item.qty;
totalSum += sum;

const div = document.createElement('div');
div.className = 'py-3 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3';
div.innerHTML = `
<div class="flex-grow">
<div class="font-mono text-xs text-blue-600 font-semibold">${item.product.articul}</div>
<div class="text-gray-900 font-medium">${item.product.name || 'Товар'}</div>
<div class="text-xs text-gray-500">Оптовая цена: ${item.product.wholesale.toLocaleString('ru-RU')} ֏</div>
</div>
<div class="flex items-center gap-4 w-full sm:w-auto justify-between sm:justify-end">
<div class="flex items-center border rounded-lg overflow-hidden bg-gray-50">
<button onclick="changeQty('${item.product.articul}', -1)" class="px-3 py-1 bg-gray-200 hover:bg-gray-300 font-bold">-</button>
<span class="px-4 py-1 font-semibold text-sm">${item.qty}</span>
<button onclick="changeQty('${item.product.articul}', 1)" class="px-3 py-1 bg-gray-200 hover:bg-gray-300 font-bold">+</button>
</div>
<div class="font-bold text-gray-900 w-28 text-right">${sum.toLocaleString('ru-RU')} ֏</div>
</div>
`;
listContainer.appendChild(div);
});

document.getElementById('modalTotalSum').innerText = totalSum.toLocaleString('ru-RU') + ' ֏';
document.getElementById('orderModal').classList.remove('hidden');
}

function changeQty(articul, delta) {
if (!cart[articul]) return;
cart[articul].qty += delta;
if (cart[articul].qty <= 0) {
delete cart[articul];
}
updateOrderPanel();
renderTable();

if (Object.keys(cart).length === 0) {
closeOrderModal();
} else if (!document.getElementById('orderModal').classList.contains('hidden')) {
openOrderModal();
}
}

function closeOrderModal() {
document.getElementById('orderModal').classList.add('hidden');
}

function getSelectedPaymentMethod() {
const radios = document.getElementsByName('paymentMethod');
for (let r of radios) {
if (r.checked) return r.value;
}
return 'Наличными';
}

function copyOrderText() {
const paymentMethod = getSelectedPaymentMethod();
let text = `ЗАКАЗ ИЗ КАТАЛОГА:\nСпособ оплаты: ${paymentMethod}\n\n`;
let total = 0;
let i = 1;

Object.values(cart).forEach(item => {
const sum = item.product.wholesale * item.qty;
total += sum;
text += `${i}. Артикул: ${item.product.articul}\n   Наименование: ${item.product.name}\n   Количество: ${item.qty} шт.\n   Цена (Опт): ${item.product.wholesale.toLocaleString('ru-RU')} ֏\n   Сумма: ${sum.toLocaleString('ru-RU')} ֏\n\n`;
i++;
});
text += `ИТОГО СУММА: ${total.toLocaleString('ru-RU')} ֏`;

navigator.clipboard.writeText(text).then(() => {
alert('Текст заказа успешно скопирован в буфер обмена!');
closeOrderModal();
});
}

function downloadOrderExcel() {
const paymentMethod = getSelectedPaymentMethod();
const excelData = [];
let totalSum = 0;

Object.values(cart).forEach(item => {
const sum = item.product.wholesale * item.qty;
totalSum += sum;
excelData.push({
'Артикул': item.product.articul,
'Бренд': item.product.brand,
'Наименование': item.product.name,
'Количество (шт)': item.qty,
'Оптовая цена (AMD)': item.product.wholesale,
'Сумма (AMD)': sum
});
});

excelData.push({
'Артикул': '',
'Бренд': '',
'Наименование': 'ИТОГО',
'Количество (шт)': '',
'Оптовая цена (AMD)': '',
'Сумма (AMD)': totalSum
});

excelData.push({
'Артикул': 'Способ оплаты:',
'Бренд': paymentMethod,
'Наименование': '',
'Количество (шт)': '',
'Оптовая цена (AMD)': '',
'Сумма (AMD)': ''
});

const worksheet = XLSX.utils.json_to_sheet(excelData);
const workbook = XLSX.utils.book_new();
XLSX.utils.book_append_sheet(workbook, worksheet, "Заказ");

XLSX.writeFile(workbook, `Zakaz_${new Date().toISOString().slice(0,10)}.xlsx`);
}

document.getElementById('searchInput').oninput = renderTable;
window.onload = loadExcelFile;
</script>
</body>
</html>
